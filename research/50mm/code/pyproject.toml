[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wlr50-research"
version = "0.1.0"
description = "Full-traversal 50 mm wheel-legged residual PPO research code"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy==1.26.0", "PyYAML==6.0.2", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
training = ["gymnasium==1.2.1", "rsl-rl-lib==5.0.1", "tensordict==0.12.2"]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
